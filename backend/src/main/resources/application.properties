# ===========================================================================
# Acme Insurance backend: the token service (auth.*), the directory sync (sync.*)
# and the InsureDirectory API (directory.*) in one Quarkus app, which also serves
# the Angular app from ../frontend. Values come from the environment; compose.yaml
# sets them (see .env.example).
# ===========================================================================
quarkus.application.name=acmeinsurance-backend
quarkus.http.port=8080
# Development (./gradlew quarkusDev) runs beside the compose container, which holds 8080.
%dev.quarkus.http.port=8083
camel.main.routes-include-pattern=classpath:routes/*.camel.yaml
quarkus.log.category."com.acmeinsurance".level=INFO

# ---------------------------------------------------------------------------
# Directory server, and the service account each module binds as. The accounts
# stay separate so OpenLDAP's ACLs keep each module to its own rights.
# ---------------------------------------------------------------------------
ldap.url=${LDAP_URL:ldap://localhost:1389}
ldap.base-dn=${LDAP_BASE_DN:dc=acmeinsurance,dc=com}
ldap.auth.bind-dn=cn=svc-auth,ou=services,${ldap.base-dn}
ldap.auth.bind-password=${SVC_AUTH_PASSWORD:}
ldap.sync.bind-dn=cn=svc-sync,ou=services,${ldap.base-dn}
ldap.sync.bind-password=${SVC_SYNC_PASSWORD:}
ldap.directory.bind-dn=cn=svc-directory,ou=services,${ldap.base-dn}
ldap.directory.bind-password=${SVC_DIRECTORY_PASSWORD:}

# ===========================================================================
# Token service (com.acmeinsurance.auth): /oauth2/*, /.well-known/*
# ===========================================================================
# Public base URL of this app (no trailing slash): the "iss" of every token
# and the base of the endpoints in /.well-known/oauth-authorization-server.
# In production this is an https URL; run behind a TLS-terminating proxy.
auth.issuer=${AUTH_ISSUER:http://localhost:8080}
%dev.auth.issuer=${AUTH_ISSUER:http://localhost:8083}
# "aud" of access tokens; resource servers must check it.
auth.audience=${AUTH_AUDIENCE:acmeinsurance}
# Which user types' access tokens carry which grant claims (docs/LDAP_Schema_Definition.md).
auth.claims.features-for=agent,internal,other
auth.claims.accounts-for=agent,internal,other
auth.claims.policies-for=member,other

auth.tokens.access-ttl=PT15M
auth.tokens.refresh-ttl=PT8H
auth.tokens.session-max=PT24H
auth.tokens.code-ttl=PT1M
auth.tokens.login-ttl=PT10M

# RSA signing key (PKCS#8 PEM). Created on first start when missing; keep it on
# a volume. See SigningKeys for rotation.
auth.signing.key-file=${AUTH_SIGNING_KEY_FILE:keys/signing-key.pem}
auth.signing.generate=true
# auth.signing.previous-public-key-files=/keys/old-public.pem

# Browser apps calling /oauth2/token from another origin need CORS, e.g.:
# quarkus.http.cors.enabled=true
# quarkus.http.cors.origins=https://portal.acmeinsurance.example

# ===========================================================================
# Directory sync (com.acmeinsurance.sync): Salesforce, CSV intake, /sync/*
# ===========================================================================
# Salesforce connection (camel-salesforce). Default: OAuth 2.0 client credentials
# flow, using a connected app (or external client app) with "Enable Client
# Credentials Flow" and a "Run As" integration user. That user needs read access
# to Account (incl. RecordType), User and, if used, AccountContactRelation.
#
# The component is built by SalesforceComponentProducer from these settings, not
# from camel.component.salesforce.*: Camel starts an auto-configured component
# at boot, and it refuses to start without a client ID. Built on demand, it is
# only created when a sync actually queries Salesforce. (JWT bearer would need
# userName and keystore settings added to the producer.)
#
# false (SF_ENABLED=false): no Salesforce routes, so the app and the CSV intake
# run without Salesforce credentials.
sync.salesforce.enabled=${SF_ENABLED:true}
# Your My Domain URL, e.g. https://acmeinsurance.my.salesforce.com (sandbox: ...sandbox.my.salesforce.com)
sync.salesforce.login-url=${SF_LOGIN_URL:https://login.salesforce.com}
sync.salesforce.client-id=${SF_CLIENT_ID:}
sync.salesforce.client-secret=${SF_CLIENT_SECRET:}

# sync.ldap.people-dn / accounts-dn / agencies-dn / clients-dn / underwriting-companies-dn default to the
# Acme Insurance tree (ou=people / ou=accounts / ou=agencies / ou=clients / ou=underwritingCompanies
# under dc=acmeinsurance,dc=com). The server and svc-sync's password are under ldap.* above.

# ---------------------------------------------------------------------------
# Agencies, agreements and books (Account record types in Salesforce)
# ASSUMPTIONS to check against the org:
#   - the three levels are Account record types with these developer names
#   - the hierarchy is held in ParentId (agency > agreement > book)
#   - AccountNumber holds the business identifier used as cn (AG0042,
#     AGR-0042-01, BK-000311); point cn-field at the custom field if not
# Records with any other record type are ignored.
# ---------------------------------------------------------------------------
sync.accounts.soql=SELECT Id, Name, AccountNumber, ParentId, RecordType.DeveloperName FROM Account \
  WHERE RecordType.DeveloperName IN ('Agency', 'Agreement', 'Book')
sync.accounts.cn-field=AccountNumber
sync.accounts.parent-field=ParentId
sync.accounts.level-field=RecordType.DeveloperName
sync.accounts.record-types.Agency=agency
sync.accounts.record-types.Agreement=agreement
sync.accounts.record-types.Book=book
# Underwriting company of each agreement: the agreement field holding the
# company's name, which must match the cn of an entry under
# ou=underwritingCompanies (maintained in InsureDirectory or by hand; the sync
# only reads them). Add the field to sync.accounts.soql as well. Unset (the
# default): the sync never touches acmeUnderwritingCompanyDN. When set, also set
# SF_MANAGES_UNDERWRITING_COMPANY=true, so InsureDirectory makes it read-only on
# Salesforce agreements.
# sync.accounts.underwriting-company-field=Underwriting_Company__r.Name

# ---------------------------------------------------------------------------
# Brokers and agents (every Salesforce User in this org is a broker or agent)
# Users not returned by the query (deactivated, or filtered out) are LOCKED in
# LDAP, not deleted. Exclude admin and integration users here, e.g. by Profile.
# ---------------------------------------------------------------------------
sync.agents.enabled=true
sync.agents.soql=SELECT Id, Username, FirstName, LastName, Email, Phone, Title, IsActive, \
  ContactId, Contact.AccountId FROM User WHERE IsActive = true
# uid (the LDAP login name). Username is unique across all of Salesforce;
# FederationIdentifier is an alternative if it is populated.
sync.agents.uid-field=Username
# LDAP attribute = User field. These are replaced on every run.
sync.agents.attributes.givenName=FirstName
sync.agents.attributes.sn=LastName
sync.agents.attributes.mail=Email
sync.agents.attributes.telephoneNumber=Phone
sync.agents.attributes.title=Title

# Grants. ASSUMPTION: agents are Experience Cloud (partner) users whose Contact
# belongs to their agency Account. If agents are standard users, point
# agency-field at the User field that holds the agency ID instead.
sync.agents.agency-field=Contact.AccountId
# Extra agreement/book grants, one row per contact and account. Requires
# "Contacts to Multiple Accounts"; leave commented out if it is not enabled.
#sync.agents.entitlement-soql=SELECT ContactId, AccountId FROM AccountContactRelation WHERE IsActive = true
#sync.agents.entitlement-contact-field=ContactId
#sync.agents.entitlement-account-field=AccountId
# true: Salesforce is the source of truth for agents' agency/agreement/book
# grants, so grants added by hand under ou=agencies are removed. Client grants
# (ou=clients) are never touched.
sync.agents.prune-grants=true
sync.agents.password-policy=cn=agents,ou=policies,${ldap.base-dn}

# Schedules. Quartz cron (sec min hour day month weekday): 02:15 every night.
sync.schedule.cron=0 15 2 * * ?
sync.schedule.run-on-startup=true

# Change Data Capture (needs CDC enabled for the objects in Salesforce)
sync.cdc.enabled=false
sync.cdc.channel=data/ChangeEvents
sync.cdc.debounce-ms=120000

# CSV intake for internal users, members and others
sync.csv.inbox=${CSV_INBOX:inbox}
sync.csv.internal-password-policy=cn=internal,ou=policies,${ldap.base-dn}

# Safety. A run may delete (accounts) or lock (agents) at most this share of a
# source's entries. A query returning nothing never removes anything.
sync.safety.max-remove-percent=10
# Take over hand-made entries that match a source record (adds acmeSource).
sync.safety.adopt-unowned=false
# Log every write instead of applying it. Use for the first run against a real org.
sync.safety.dry-run=${DRY_RUN:false}

# ===========================================================================
# InsureDirectory API (com.acmeinsurance.directory): /api/*, /auth/*
# ===========================================================================
# Base URL users reach the app at. Its OAuth client's redirect URI is {public-url}/auth/callback,
# which must be one of the redirect URIs of cn=insure-directory (37-oauth-insure-directory.ldif).
directory.public-url=${DIRECTORY_PUBLIC_URL:${auth.issuer}}
%dev.directory.public-url=${DIRECTORY_PUBLIC_URL:http://localhost:4200}
directory.auth.client-secret=${DIRECTORY_CLIENT_SECRET:}
directory.db.path=${DIRECTORY_DB:insure-directory.db}
directory.salesforce-manages-underwriting-company=${SF_MANAGES_UNDERWRITING_COMPANY:false}

# ===========================================================================
# HTTP API documents
# ===========================================================================
# The token service's operations come from the annotations in auth/web (merged with
# META-INF/openapi.yaml) at /q/openapi; OPENAPI_ENABLED=false stops serving it.
quarkus.smallrye-openapi.enabled=${OPENAPI_ENABLED:true}
# The Camel REST DSL operations (/sync, /api, /auth) are generated by camel-quarkus-openapi-java
# and served by Camel at /openapi (Quarkus's merge option only reads Java RouteBuilder classes).
# Title and description: restConfiguration in routes/common.camel.yaml.
camel.rest.api-context-path=/openapi
# Host shown in that document's servers list (otherwise the bind address, 0.0.0.0).
camel.rest.api-host=${BACKEND_API_HOST:localhost:8080}
# Keep REST verbs and their direct: routes separate. With inlining (the Camel 4 default)
# the verbs take on a route precondition (salesforce-sync.camel.yaml) and disappear (404).
camel.rest.inline-routes=false
# Swagger UI is only in dev and test builds: this app is the production login service.

# ===========================================================================
# Tests (@QuarkusTest): LdapTestResource points ldap.* at an in-memory directory.
# ===========================================================================
%test.sync.salesforce.enabled=false
%test.sync.schedule.run-on-startup=false
%test.sync.csv.inbox=build/test-inbox
%test.directory.db.path=build/test-insure-directory.db
%test.directory.public-url=http://localhost:8080
%test.quarkus.http.test-port=0
