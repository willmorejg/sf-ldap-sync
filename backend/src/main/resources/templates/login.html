<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in - Acme Insurance</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f4f5f7; color: #1d2330; margin: 0; }
  main { max-width: 22rem; margin: 10vh auto; background: #fff; padding: 2rem; border-radius: 8px;
         box-shadow: 0 1px 4px rgba(0,0,0,.12); }
  h1 { font-size: 1.25rem; margin: 0 0 .25rem; }
  p.app { margin: 0 0 1.5rem; color: #5a6475; }
  label { display: block; font-size: .9rem; margin: 1rem 0 .25rem; }
  input { width: 100%; box-sizing: border-box; padding: .55rem; font-size: 1rem; border: 1px solid #b8bfcc; border-radius: 4px; }
  button { margin-top: 1.5rem; width: 100%; padding: .65rem; font-size: 1rem; border: 0; border-radius: 4px;
           background: #1f5fbf; color: #fff; cursor: pointer; }
  .msg { background: #fdecea; color: #8a1f11; padding: .6rem .75rem; border-radius: 4px; font-size: .9rem; }
</style>
</head>
<body>
<main>
  <h1>{#if change}Change your password{#else}Sign in{/if}</h1>
  <p class="app">to {client}</p>
  {#if message}<p class="msg" role="alert">{message}</p>{/if}
  <form method="post" action="authorize" autocomplete="on">
    <input type="hidden" name="request_id" value="{requestId}">
    <label for="username">Username</label>
    <input id="username" name="username" value="{username}" autocomplete="username" required {#if change}readonly{/if}>
    <label for="password">{#if change}Current password{#else}Password{/if}</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    {#if change}
    <label for="new_password">New password</label>
    <input id="new_password" name="new_password" type="password" autocomplete="new-password" required>
    <label for="confirm_password">Repeat new password</label>
    <input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" required>
    {/if}
    <button type="submit">{#if change}Change password and sign in{#else}Sign in{/if}</button>
  </form>
</main>
</body>
</html>
