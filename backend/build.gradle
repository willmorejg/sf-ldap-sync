// The Acme Insurance backend: one Quarkus app holding the token service (com.acmeinsurance.auth),
// the directory sync (com.acmeinsurance.sync) and the InsureDirectory API (com.acmeinsurance.directory),
// with what they share in com.acmeinsurance.common. It also serves the Angular app built in ../frontend.
plugins {
    id 'java'
    id 'io.quarkus'
    id 'jacoco'
    id 'org.sonarqube' version '6.2.0.5505'
}

group = 'com.acmeinsurance'
version = '0.1.0-SNAPSHOT'

sonar {
    properties {
        property 'sonar.projectKey', 'willmorejg_sf-ldap-sync'
        property 'sonar.organization', 'willmorejg'
        property 'sonar.host.url', 'https://sonarcloud.io'
        property 'sonar.coverage.jacoco.xmlReportPaths',
                layout.buildDirectory.file('reports/jacoco/test/jacocoTestReport.xml').get().asFile.path
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation enforcedPlatform("${quarkusPlatformGroupId}:quarkus-bom:${quarkusPlatformVersion}")
    implementation enforcedPlatform("${quarkusPlatformGroupId}:quarkus-camel-bom:${quarkusPlatformVersion}")

    // Camel: YAML DSL routes (sync schedules, CSV intake) and REST DSL endpoints (/sync, /api, /auth).
    implementation 'org.apache.camel.quarkus:camel-quarkus-yaml-dsl'
    implementation 'org.apache.camel.quarkus:camel-quarkus-salesforce'
    implementation 'org.apache.camel.quarkus:camel-quarkus-bean'
    implementation 'org.apache.camel.quarkus:camel-quarkus-quartz'
    implementation 'org.apache.camel.quarkus:camel-quarkus-timer'
    implementation 'org.apache.camel.quarkus:camel-quarkus-file'
    implementation 'org.apache.camel.quarkus:camel-quarkus-platform-http'
    implementation 'org.apache.camel.quarkus:camel-quarkus-rest'
    implementation 'org.apache.camel.quarkus:camel-quarkus-direct'
    implementation 'org.apache.camel.quarkus:camel-quarkus-jackson'
    // Generates the OpenAPI document of the REST DSL routes; served at /openapi.
    implementation 'org.apache.camel.quarkus:camel-quarkus-openapi-java'
    // Brings a managed commons-csv version; parsing is done in CsvIntakeService.
    implementation 'org.apache.camel.quarkus:camel-quarkus-csv'

    // Token service: JAX-RS endpoints under /oauth2, the Qute login page, OpenAPI from annotations (/q/openapi).
    implementation 'io.quarkus:quarkus-rest'
    implementation 'io.quarkus:quarkus-rest-jackson'
    implementation 'io.quarkus:quarkus-rest-qute'
    implementation 'io.quarkus:quarkus-smallrye-openapi'
    // Route filters: security headers, and the Angular app for its deep links.
    implementation 'io.quarkus:quarkus-reactive-routes'

    implementation "com.unboundid:unboundid-ldapsdk:${unboundidVersion}"
    implementation 'org.bitbucket.b_c:jose4j'
    // InsureDirectory: audit log and saved queries.
    implementation "org.xerial:sqlite-jdbc:${sqliteJdbcVersion}"

    testImplementation 'io.quarkus:quarkus-junit'
    testImplementation 'io.rest-assured:rest-assured'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters'
}

// The Angular build (../frontend/dist, from `npm run build`), when present, is served from META-INF/resources:
// one origin for the app, its API and the token service, so the session cookie stays SameSite and no CORS is needed.
processResources {
    from('../frontend/dist') {
        into 'META-INF/resources'
    }
}

test {
    useJUnitPlatform()
    systemProperty 'java.util.logging.manager', 'org.jboss.logmanager.LogManager'
    // The LDAP tests load ../openldap/ldif relative to this module;
    // declaring it as an input reruns them when the schema or tree changes.
    workingDir = projectDir
    inputs.dir('../openldap/ldif').withPropertyName('ldif').withPathSensitivity(PathSensitivity.RELATIVE)
    // Every test run writes the coverage report that the Sonar analysis reads.
    finalizedBy jacocoTestReport
    testLogging {
        events 'failed'
        exceptionFormat = 'full'
    }
}

jacoco {
    // 0.8.14 is the first release that reads Java 25 class files.
    toolVersion = '0.8.14'
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}
