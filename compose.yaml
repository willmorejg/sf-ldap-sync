# podman compose up --build -d
# Ports are bound to localhost only.

# podman-compose: no pod, so backend can have its own user namespace (userns_mode).
x-podman:
  in_pod: false

services:
  openldap:
    build: ./openldap
    environment:
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD:?set in .env}
      SVC_SYNC_PASSWORD: ${SVC_SYNC_PASSWORD:?set in .env}
      SVC_AUTH_PASSWORD: ${SVC_AUTH_PASSWORD:?set in .env}
      SVC_DIRECTORY_PASSWORD: ${SVC_DIRECTORY_PASSWORD:?set in .env}
      # Creates the InsureDirectory OAuth client on first start (32+ chars).
      DIRECTORY_CLIENT_SECRET: ${DIRECTORY_CLIENT_SECRET:-}
      LOAD_SAMPLES: ${LOAD_SAMPLES:-true}
      LOAD_SAMPLE_AGENCIES: ${LOAD_SAMPLE_AGENCIES:-false}
      # Optional: creates the sample confidential OAuth client demo-app (32+ chars).
      OAUTH_DEMO_CLIENT_SECRET: ${OAUTH_DEMO_CLIENT_SECRET:-}
      # phpLDAPadmin (nginx + php-fpm in this container) at http://localhost:8090/
      PHPLDAPADMIN_ENABLED: ${PHPLDAPADMIN_ENABLED:-true}
    ports:
      - "127.0.0.1:1389:1389"
      - "127.0.0.1:8090:8080"
    volumes:
      - ldap-config:/etc/ldap/slapd.d
      - ldap-data:/var/lib/ldap
    # Defined here, not only in the Containerfile: podman builds OCI images,
    # which drop HEALTHCHECK, and backend waits for this service to be healthy.
    healthcheck:
      test: ["CMD-SHELL", "ldapsearch -x -H ldap://127.0.0.1:1389 -b '' -s base -LLL namingContexts >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  # The backend (backend/): token service (/oauth2, /.well-known), directory sync (CSV
  # inbox, Salesforce, /sync) and InsureDirectory (the app at http://localhost:8080/, its
  # API under /api and /auth) in one container. Each part binds as its own service account.
  backend:
    build:
      context: .
      dockerfile: backend/Containerfile
    depends_on:
      openldap:
        condition: service_healthy
    environment:
      LDAP_URL: ldap://openldap:1389
      SVC_AUTH_PASSWORD: ${SVC_AUTH_PASSWORD:?set in .env}
      SVC_SYNC_PASSWORD: ${SVC_SYNC_PASSWORD:?set in .env}
      SVC_DIRECTORY_PASSWORD: ${SVC_DIRECTORY_PASSWORD:?set in .env}
      # Public base URL of this app: the "iss" of every token, and InsureDirectory's
      # address (its redirect URI {url}/auth/callback must be registered on cn=insure-directory).
      AUTH_ISSUER: ${AUTH_ISSUER:-http://localhost:8080}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-acmeinsurance}
      OPENAPI_ENABLED: ${OPENAPI_ENABLED:-true}
      BACKEND_API_HOST: localhost:8080
      DIRECTORY_CLIENT_SECRET: ${DIRECTORY_CLIENT_SECRET:?set in .env}
      SF_MANAGES_UNDERWRITING_COMPANY: ${SF_MANAGES_UNDERWRITING_COMPANY:-false}
      SF_ENABLED: ${SF_ENABLED:-true}
      SF_LOGIN_URL: ${SF_LOGIN_URL:-}
      SF_CLIENT_ID: ${SF_CLIENT_ID:-}
      SF_CLIENT_SECRET: ${SF_CLIENT_SECRET:-}
      DRY_RUN: ${DRY_RUN:-true}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./inbox:/work/inbox:Z
      - auth-keys:/keys:U
      - directory-data:/data:U
    # Rootless Podman: map your host user to the container's uid 1001 so the
    # sync can lock, move and create files in ./inbox (otherwise the host
    # owner appears as root in the container and the inbox is read-only).
    userns_mode: "keep-id:uid=1001,gid=0"
    restart: unless-stopped

volumes:
  ldap-config:
  ldap-data:
  auth-keys:
  directory-data:
