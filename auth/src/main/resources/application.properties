quarkus.application.name=acmeinsurance-ldap-auth
quarkus.http.port=8081

# Public base URL of this service (no trailing slash): the "iss" of every token
# and the base of the endpoints in /.well-known/oauth-authorization-server.
# In production this is an https URL; run behind a TLS-terminating proxy.
auth.issuer=${AUTH_ISSUER:http://localhost:8081}
# "aud" of access tokens; resource servers must check it.
auth.audience=${AUTH_AUDIENCE:acmeinsurance}
# Which user types' access tokens carry which grant claims (docs/LDAP_Schema_Definition.md).
auth.claims.features-for=agent,internal,other
auth.claims.accounts-for=agent,internal,other
auth.claims.policies-for=member,other

auth.ldap.url=${LDAP_URL:ldap://localhost:1389}
auth.ldap.bind-dn=cn=svc-auth,ou=services,dc=acmeinsurance,dc=com
auth.ldap.bind-password=${SVC_AUTH_PASSWORD}
auth.ldap.pool-size=4

auth.tokens.access-ttl=PT15M
auth.tokens.refresh-ttl=PT8H
auth.tokens.session-max=PT24H
auth.tokens.code-ttl=PT1M
auth.tokens.login-ttl=PT10M

# RSA signing key (PKCS#8 PEM). Created on first start when missing; keep it on
# a volume. See SigningKeys for rotation.
auth.signing.key-file=${AUTH_SIGNING_KEY_FILE:keys/signing-key.pem}
auth.signing.generate=true
# auth.signing.previous-public-key-files=/keys/old-public.pem

# Browser apps calling /oauth2/token from another origin need CORS, e.g.:
# quarkus.http.cors.enabled=true
# quarkus.http.cors.origins=https://portal.acmeinsurance.example

# OpenAPI: the spec is served at /q/openapi (base document in META-INF/openapi.yaml,
# operations from the annotations in web/). Set OPENAPI_ENABLED=false to stop serving
# it. Swagger UI (/q/swagger-ui) is only included in dev and test builds, which
# keeps it off the production login service.
quarkus.smallrye-openapi.enable=${OPENAPI_ENABLED:true}
