# Base OpenAPI document for the token service. Quarkus merges it with the
# annotations on the resources in com.acmeinsurance.auth.web: this file holds the
# info block, the client authentication scheme and the shared schemas; the
# operations come from the annotations.
openapi: 3.1.0
info:
  title: Acme Insurance token service
  version: 0.1.0
  description: |
    OAuth 2.0 authorization server for Acme Insurance applications. It checks
    passwords against the OpenLDAP directory and issues RS256 JWT access tokens.

    Supported flows:
    - `authorization_code` with PKCE (S256 only), for browser and mobile apps
    - `password`, for confidential (server-side) clients only
    - `refresh_token`, for confidential clients only

    Discovery: `/.well-known/oauth-authorization-server` (RFC 8414). Resource
    servers verify access tokens offline with the keys at `/oauth2/jwks`.

    Sequence diagrams: `docs/sequence/oauth-*.md` in the repository.
tags:
  - name: OAuth 2.0
    description: Authorization and token endpoints (RFC 6749, RFC 7636)
  - name: Discovery
    description: Server metadata and signing keys
components:
  securitySchemes:
    clientBasic:
      type: http
      scheme: basic
      description: |
        Confidential clients: client_id and client secret (client_secret_basic).
        They may instead send client_id and client_secret as form fields
        (client_secret_post), but not both. Public clients send client_id only.
  schemas:
    TokenRequest:
      type: object
      required: [grant_type]
      description: Form fields; which ones are required depends on grant_type.
      properties:
        grant_type:
          type: string
          enum: [authorization_code, password, refresh_token]
        client_id:
          type: string
          description: Required for public clients and for client_secret_post.
        client_secret:
          type: string
          description: client_secret_post only. Do not combine with HTTP Basic.
        code:
          type: string
          description: authorization_code. Single use, valid for 1 minute.
        redirect_uri:
          type: string
          description: authorization_code. Must equal the one in the authorization request.
        code_verifier:
          type: string
          description: authorization_code. The PKCE verifier (43 to 128 characters).
        username:
          type: string
          description: password. The user's uid.
        password:
          type: string
          format: password
          description: password.
        refresh_token:
          type: string
          description: refresh_token.
    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token:
          type: string
          description: |
            RS256 JWT (typ at+jwt). Claims: iss, sub (entryUUID), aud, client_id,
            auth_time, preferred_username, name, given_name, family_name, email,
            user_type, and by user type: features, accounts, policies.
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: Access token lifetime in seconds (default 900).
        refresh_token:
          type: string
          description: Confidential clients allowed the refresh_token grant only.
        refresh_expires_in:
          type: integer
          description: Seconds until the refresh token expires; capped by the session maximum.
    OAuthError:
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum: [invalid_request, invalid_client, invalid_grant, unauthorized_client, unsupported_grant_type]
        error_description:
          type: string
    ServerMetadata:
      type: object
      description: RFC 8414 authorization server metadata.
      properties:
        issuer:
          type: string
        authorization_endpoint:
          type: string
        token_endpoint:
          type: string
        jwks_uri:
          type: string
        response_types_supported:
          type: array
          items:
            type: string
        grant_types_supported:
          type: array
          items:
            type: string
        code_challenge_methods_supported:
          type: array
          items:
            type: string
        token_endpoint_auth_methods_supported:
          type: array
          items:
            type: string
    JsonWebKeySet:
      type: object
      description: RFC 7517 key set; the current key and any previous public keys kept for rotation.
      properties:
        keys:
          type: array
          items:
            type: object
            properties:
              kty:
                type: string
              kid:
                type: string
              use:
                type: string
              alg:
                type: string
              n:
                type: string
              e:
                type: string
