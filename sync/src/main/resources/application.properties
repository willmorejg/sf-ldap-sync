# ---------------------------------------------------------------------------
# Runtime
# ---------------------------------------------------------------------------
quarkus.application.name=acmeinsurance-ldap-sync
quarkus.http.port=8080
camel.main.routes-include-pattern=classpath:routes/*.camel.yaml

# ---------------------------------------------------------------------------
# Salesforce connection (camel-salesforce)
#
# Default: OAuth 2.0 client credentials flow, using a connected app (or external
# client app) with "Enable Client Credentials Flow" and a "Run As" integration
# user. That user needs read access to Account (incl. RecordType), User and,
# if used, AccountContactRelation.
#
# The component is built by SalesforceComponentProducer from these settings, not
# from camel.component.salesforce.*: Camel starts an auto-configured component
# at boot, and it refuses to start without a client ID. Built on demand, it is
# only created when a sync actually queries Salesforce. (JWT bearer would need
# userName and keystore settings added to the producer.)
# ---------------------------------------------------------------------------
# false (SF_ENABLED=false): no Salesforce routes, so the app and the CSV intake
# run without Salesforce credentials.
sync.salesforce.enabled=${SF_ENABLED:true}
# Your My Domain URL, e.g. https://acmeinsurance.my.salesforce.com (sandbox: ...sandbox.my.salesforce.com)
sync.salesforce.login-url=${SF_LOGIN_URL:https://login.salesforce.com}
sync.salesforce.client-id=${SF_CLIENT_ID:}
sync.salesforce.client-secret=${SF_CLIENT_SECRET:}

# ---------------------------------------------------------------------------
# Directory
# ---------------------------------------------------------------------------
sync.ldap.url=${LDAP_URL:ldap://localhost:1389}
sync.ldap.bind-dn=cn=svc-sync,ou=services,dc=acmeinsurance,dc=com
sync.ldap.bind-password=${SVC_SYNC_PASSWORD}
sync.ldap.pool-size=4
# sync.ldap.people-dn / accounts-dn / agencies-dn / clients-dn default to the
# Acme Insurance tree (ou=people / ou=accounts / ou=agencies / ou=clients under dc=acmeinsurance,dc=com).

# ---------------------------------------------------------------------------
# Agencies, agreements and books (Account record types in Salesforce)
# ASSUMPTIONS to check against the org:
#   - the three levels are Account record types with these developer names
#   - the hierarchy is held in ParentId (agency > agreement > book)
#   - AccountNumber holds the business identifier used as cn (AG0042,
#     AGR-0042-01, BK-000311); point cn-field at the custom field if not
# Records with any other record type are ignored.
# ---------------------------------------------------------------------------
sync.accounts.soql=SELECT Id, Name, AccountNumber, ParentId, RecordType.DeveloperName FROM Account \
  WHERE RecordType.DeveloperName IN ('Agency', 'Agreement', 'Book')
sync.accounts.cn-field=AccountNumber
sync.accounts.parent-field=ParentId
sync.accounts.level-field=RecordType.DeveloperName
sync.accounts.record-types.Agency=agency
sync.accounts.record-types.Agreement=agreement
sync.accounts.record-types.Book=book

# ---------------------------------------------------------------------------
# Brokers and agents (every Salesforce User in this org is a broker or agent)
# Users not returned by the query (deactivated, or filtered out) are LOCKED in
# LDAP, not deleted. Exclude admin and integration users here, e.g. by Profile.
# ---------------------------------------------------------------------------
sync.agents.enabled=true
sync.agents.soql=SELECT Id, Username, FirstName, LastName, Email, Phone, Title, IsActive, \
  ContactId, Contact.AccountId FROM User WHERE IsActive = true
# uid (the LDAP login name). Username is unique across all of Salesforce;
# FederationIdentifier is an alternative if it is populated.
sync.agents.uid-field=Username
# LDAP attribute = User field. These are replaced on every run.
sync.agents.attributes.givenName=FirstName
sync.agents.attributes.sn=LastName
sync.agents.attributes.mail=Email
sync.agents.attributes.telephoneNumber=Phone
sync.agents.attributes.title=Title

# Grants. ASSUMPTION: agents are Experience Cloud (partner) users whose Contact
# belongs to their agency Account. If agents are standard users, point
# agency-field at the User field that holds the agency ID instead.
sync.agents.agency-field=Contact.AccountId
# Extra agreement/book grants, one row per contact and account. Requires
# "Contacts to Multiple Accounts"; leave commented out if it is not enabled.
#sync.agents.entitlement-soql=SELECT ContactId, AccountId FROM AccountContactRelation WHERE IsActive = true
#sync.agents.entitlement-contact-field=ContactId
#sync.agents.entitlement-account-field=AccountId
# true: Salesforce is the source of truth for agents' agency/agreement/book
# grants, so grants added by hand under ou=agencies are removed. Client grants
# (ou=clients) are never touched.
sync.agents.prune-grants=true
sync.agents.password-policy=cn=agents,ou=policies,dc=acmeinsurance,dc=com

# ---------------------------------------------------------------------------
# Schedules
# ---------------------------------------------------------------------------
# Quartz cron (sec min hour day month weekday): 02:15 every night
sync.schedule.cron=0 15 2 * * ?
sync.schedule.run-on-startup=true

# Change Data Capture (needs CDC enabled for the objects in Salesforce)
sync.cdc.enabled=false
sync.cdc.channel=data/ChangeEvents
sync.cdc.debounce-ms=120000

# ---------------------------------------------------------------------------
# CSV intake for internal users, members and others
# ---------------------------------------------------------------------------
sync.csv.inbox=${CSV_INBOX:inbox}
sync.csv.internal-password-policy=cn=internal,ou=policies,dc=acmeinsurance,dc=com

# ---------------------------------------------------------------------------
# Safety
# ---------------------------------------------------------------------------
# A run may delete (accounts) or lock (agents) at most this share of a
# source's entries. A query returning nothing never removes anything.
sync.safety.max-remove-percent=10
# Take over hand-made entries that match a source record (adds acmeSource).
sync.safety.adopt-unowned=false
# Log every write instead of applying it. Use for the first run against a real org.
sync.safety.dry-run=${DRY_RUN:false}

quarkus.log.category."com.acmeinsurance".level=INFO

# OpenAPI: camel-quarkus-openapi-java generates the document from the REST DSL in
# routes/*.camel.yaml at runtime (title and description: restConfiguration there) and Camel serves it at /openapi (JSON;
# /openapi.yaml for YAML). Quarkus's own /q/openapi is not used: its merge option
# (quarkus.camel.openapi.expose.enabled) only reads Java RouteBuilder classes.
# The Camel extension registers /openapi with Swagger UI (/q/swagger-ui) itself.
# Swagger UI is built into every image: the port is only published on the host's
# loopback. There is no runtime switch for /openapi (OPENAPI_ENABLED is for the
# auth service only).
camel.rest.api-context-path=/openapi
# Keep REST verbs and their direct: routes separate. With inlining (the Camel 4
# default) the verbs take on a route precondition from salesforce-sync.camel.yaml
# and disappear (404) when the Salesforce sync is enabled.
camel.rest.inline-routes=false
# Host shown in the document's servers list (otherwise the bind address, 0.0.0.0,
# and Swagger UI's "Try it out" fails). Match the published port.
camel.rest.api-host=${SYNC_API_HOST:localhost:8080}
quarkus.smallrye-openapi.enable=false
quarkus.swagger-ui.always-include=true
