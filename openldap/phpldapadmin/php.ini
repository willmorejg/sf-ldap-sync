; phpLDAPadmin 1.2.6 predates PHP 8.3. It resets error_reporting itself (patched
; in the Containerfile); this covers anything that runs before it does.
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
display_errors = Off
session.cookie_httponly = 1
session.cookie_samesite = Strict
expose_php = Off
